  to: Michael or Ann-Stephan
  host: bioit-mailhog.sciensano.be:1025

failsafe:
  flag_dir: /scratch/temp/flags
  flag_append: bigsupload_start_flag

postgresql_apache_pass: to_be_replaced_by_ansible

# the cgmlst thresholds are duplicated in the mongodb clustering config
alerts:
  listeria:
    threshold_warning: 7
    threshold_alert: 4
    timeframe_in_months: 12
    number_of_cases: 2
  mycobacterium:
    threshold_warning: 12
    threshold_alert: 5
    timeframe_in_months: 12000  # irrespective of time; took 1000 years
    number_of_cases: 2
  neisseria:
    threshold_warning: 7
    threshold_alert: 4
    timeframe_in_months: 12
    number_of_cases: 2
  salmonella:
    threshold_warning: 10
    threshold_alert: 5
    timeframe_in_months: 2
    number_of_cases: 5

species:
  listeria:
    typing_schemes:
      listeria_mlst:
        dirdb: /var/lib/.bioit_database_azure/sequence_typing/listeria/mlst
        tsvname: mlst
        scheme_fields: # the first element in the fields list should be an integer/primary_key
          - ST
          - CC
          - Lineage
        schemename_bigsdb: MLST
      listeria_cgmlst:
        dirdb: /var/lib/.bioit_database_azure/sequence_typing/listeria/cgmlst
        tsvname: cgmlst
        schemename_bigsdb: cgMLST
