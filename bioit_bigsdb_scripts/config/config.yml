# the cgmlst thresholds are duplicated in the mongodb clustering config
alerts:
  listeria:
    threshold_warning: 7
    threshold_alert: 4
    timeframe_in_months: 12
    number_of_cases: 2
  mycobacterium:
    threshold_warning: 12
    threshold_alert: 5
    timeframe_in_months: 12000  # irrespective of time; took 1000 years
    number_of_cases: 2
