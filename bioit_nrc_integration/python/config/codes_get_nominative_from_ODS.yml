pathogens:
  HDBP0345_SLM_LAB: salmonella
  HDBP0345_SLM_CLIN: salmonella

schema:
  LAB:
    TX_BUSINESS_KEY:
      required: True
      translation: _id
    IDC_PAT:
      required: False # default is empty in bigsdb
      translation: patient_id
    DT_PAT_DOB:
      required: False # default is empty in bigsdb # todo this needs to be in YYYY-MM-DD format
      translation: patient_birth_date
    CD_PAT_SEX:
      required: False
      default: Unknown # in saltest UNK but in DCD list Unknown
      translation: patient_sex
      code_list: CD_PAT_SEX_codes
    CD_PAT_PC: # has code list, but seeing as codes = zip doesn't really make sense to add
      required: False
      default: Unknown
      translation: patient_zip
    CD_CNTRY: # default is empty in bigsdb
      required: False
      translation: country
    TX_LAB_SAMPLE_VAL:
      required: True
      translation: specimen
#    CD_LAB_PATHOGEN: # default is empty in bigsdb
#      required: False
#      translation: serovar_final
#      code_list: CD_LAB_PATHOGEN_codes
    TX_LAB_CMNT_SPECIM:
      required: False
      default: N/A
      translation: comment
  CLIN:
    TX_BUSINESS_KEY:
      required: True
      translation: _id
    CD_HOSPZ:
      required: True
      translation: hospitalisation
      code_list: CD_HOSPZ_codes
    CD_EVOL:
      required: True
      translation: outcome
      code_list: CD_EVOL_codes
    CD_ANTBIO:
      required: True
      translation: antibiotic_therapy
      code_list: CD_ANTBIO_codes
    CD_ANTBIO_SPECIF:
      required: True
      translation: antibiotic
      code_list: CD_ANTBIO_SPECIF_codes
    CD_EPILINK:
      required: True
      translation: link
      code_list: CD_EPILINK_codes
#    CD_PROB_NAM:  # this is a list with 5 options, in mail discussions with Florian we decided that these should be 5 separate fields in bigsdb instead of the single clinical_info field because multiple options are possible and else it would be hard to query and do e.g. two field breakdown in bigsdb. Therefore this was implemented in a separate function
