pathogens:
  HDBP0345_SLM_LAB: salmonella
  HDBP0345_SLM_CLIN: salmonella
  HDBP0335_LIST_CLIN: listeria
  HDBP0335_LIST_LAB: listeria
  HDBP0333_INFL_CLIN: influenza
  HDBP0333_INFL_LAB: influenza

schema:
  LAB:
    TX_BUSINESS_KEY:
      required: True
      translation: _id
    IDC_PAT:
      required: False # default is empty in bigsdb
      translation: patient_id
    DT_PAT_DOB:
      required: False # default is empty in bigsdb
      translation: patient_birth_date
    CD_PAT_SEX:
      required: False
      default: 'Unknown' # in saltest UNK but in DCD list 'Unknown'
      translation: patient_sex
      code_list: CD_PAT_SEX_codes
    CD_PAT_PC: # has code list, but seeing as codes = zip doesn't really make sense to add
      required: False
      default: 'Unknown'
      translation: patient_zip
    CD_CNTRY: # default is empty in bigsdb
      required: False
      translation: country
    TX_LAB_SAMPLE_VAL:
      required: True
      translation: specimen
    TX_LAB_CMNT_SPECIM:
      required: False
      default: N/A
      translation: comment
    DT_LAB_RECEIVD:
      required: False
      allowed:
        - influenza
      translation: reception_date
    CD_LAB_PATHOGEN:
      required: False
      allowed:
        - influenza
      translation: Flu_type
      code_list: MICROORGANISM_codes
  CLIN:
    TX_LAB_SAMPLE_VAL:  # needed for link with WGS meta
      required: True
      translation: sample_id
    TX_BUSINESS_KEY:
      required: True
      translation: _id
    CD_HOSPZ:
      required:
        - salmonella
        - listeria
      translation: hospitalisation
      code_list: CD_HOSPZ_codes
    CD_EVOL:
      required:
        - salmonella
      translation: outcome
      code_list: CD_EVOL_codes
    CD_ANTBIO:
      required:
        - salmonella
      translation: antibiotic_therapy
      code_list: CD_ANTBIO_codes
    CD_ANTBIO_SPECIF:
      required: False
      translation: antibiotic
      code_list: CD_ANTBIO_SPECIF_codes
      other: CD_ANTBIO_SPECIF_OTH
#    CD_PROB_NAM:  # this is a list with 5 options, in mail discussions with Florian we decided that these should be 5 separate fields in bigsdb instead of the single clinical_info field because multiple options are possible and else it would be hard to query and do e.g. two field breakdown in bigsdb. Therefore this was implemented in a separate function
#      required: True
#      translation: clinical_info
#      code_list: CD_PROB_NAM_codes
    CD_EPILINK:
      required:
        - salmonella
        - listeria
      translation: epi_link
      code_list: CD_EPILINK_codes
    CD_TPE:
      required:
        - listeria
      translation: case_type
      code_list: CD_TPE_codes
    CD_OUTCM:
      required:
        - listeria
      translation: outcome
      code_list: CD_OUTCM_codes
    CD_TRANSM_ZOONSS:
      required:
        - listeria
      translation: mode_of_transmission
      code_list: CD_TRANSM_ZOONSS_codes
#    CD_PERNAT:  # in main script
#      required:
#        - listeria
#      translation:
#      code_list: CD_PERNAT_codes
    CD_PROB_NAM_PREGY:
      required: False
      translation: pregnancy_symptom
      code_list: CD_PROB_NAM_PREGY_codes
    CD_PREGY_OUTCM:
      required:
        - listeria
      translation: pregnancy_outcome
      code_list: CD_PREGY_OUTCM_codes
#    CD_SUSPC_VEH:  # in main script
#      required:
#        - listeria
#      translation:
#      code_list: CD_SUSPC_VEH_codes
#    CD_PROB_NAM_ADLT:  # in main script
#      required:
#        - listeria
#      translation:
#      code_list: CD_PROB_NAM_codes
#      other: CD_ANTBIO_SPECIF_OTH
#    CD_PROB_NAM_CHLD:  # in main script
#      required:
#        - listeria
#      translation:
#      code_list: CD_PROB_NAM_codes
    CD_VACCN_INFLZ:
      required: False
      translation: seasonal_vaccination
      code_list: YNU_codes
    DT_VACCN_INFLZ:
      required: False
      translation: vaccination_date
    CD_MEDICT_ANTIV_FLU:
      required: False
      translation: antiviral_treatment
      code_list: YNU_codes
    DT_MEDICT_ANTIV_FLU:
      required: False
      translation: antiviral_treatment_date
    CD_MEDICT_ANTIV_FLU_BRAND:
      required: False
      translation: antiviral_treatment_type
      code_list: MEDICATION_FLU_codes
    DT_LAB_COLLCN:
      required: False
      allowed:
        - influenza
      translation: sampling_date
    DT_SYMP_ONSET:
      required: False
      translation: symptoms_start_date
