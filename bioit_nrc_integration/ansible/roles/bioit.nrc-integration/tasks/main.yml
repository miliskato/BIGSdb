---
- name: check if dtap in list
  vars:
    dtaplist:
      - devtest
      - accprod
  fail:
    msg: "unsupported dtap requested, choose from {{ dtaplist }}"
  when: dtap not in dtaplist

- name: Assert if branch given
  fail:
    msg: "'branch' argument required in -e when running playbook"
  when: branch is not defined

- name: remove get_nominative_from_ODS cronjob so that it does not interfere during deployment
  ansible.builtin.file:
    path: /etc/cron.d/get_nominative_from_ODS
    state: absent
  become: yes

- name: remove main_sender_to_HD cronjob so that it does not interfere during deployment
  ansible.builtin.file:
    path: /etc/cron.d/main_sender_to_HD
    state: absent
  become: yes

- name: Install system packages
  apt:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - python3.10-dev
      - python3.10-venv
      - virtualenv
      - uwsgi
      - uwsgi-plugin-python3
      - libpcre3-dev  # needed for uwsgi?
      - supervisor
      - git

# configure Nginx
- name: Include bioit.galaxy.nginx/tasks/base.yml
  include_role:
    name: bioit.galaxy.nginx
    tasks_from: base

- name: Generate nginx conf for nrc integration from template
  template:
    src: templates/nrcint_nginx.conf.j2
    dest: /etc/nginx/sites-available/nrcint

- name: Soft link the nrc integration nginx configuration
  file:
    src: /etc/nginx/sites-available/nrcint
    dest: /etc/nginx/sites-enabled/nrcint
    state: link

 - name: Include bioit.cerbot/tasks/main.yml
   include_role:
     name: bioit.certbot
     tasks_from: main

- name: check nginx configuration
  command: sudo nginx -t

- name: Include bioit.galaxy.supervisor/tasks/extra.yml
  include_role:
    name: bioit.galaxy.supervisor
    tasks_from: extra

- name: Generate supervisor conf.d for nrcint from template
  template:
    src: templates/nrcint_supervisord.conf.j2
    dest: /etc/supervisor/conf.d/nrcint.conf

- name: Generate uwsgi config from template
  template:
    src: templates/nrcint_uwsgi.ini.j2
    dest: /etc/uwsgi/apps-available/nrcint.ini

- name: Soft link the uwsgi nrcint entry
  file:
    src: /etc/uwsgi/apps-available/nrcint.ini
    dest: /etc/uwsgi/apps-enabled/nrcint.ini
    state: link

- name: Create uwsgi log file
  ansible.builtin.file:
    path: "{{ uwsgi_log_file }}"
    state: touch
    mode: "u=rw,g=rw,o=rw"
    owner: "{{ uwsgi_user_name }}"
  become: yes

# Custom Python part
- name: Change git cloned repo owner and group to be able to update the git repo
  file:
    path: "{{ bioit_bigs_home }}"
    owner: root
    group: root
    recurse: yes
  become: yes

- name: Get updated files from git repository
  git:
    repo: "https://{{bioit_git_ro_user}}:{{ secret_bioit_git_ro_password }}@{{bioit_git_server}}/bigsdb/bigsdb.git"
    dest: "{{ bioit_bigs_home }}"
    version: "{{ branch }}"
    force: true
  become: yes

- name: Change git cloned repo owner and group to the uwsgi group to be able to use files inside
  file:
    path: "{{ bioit_bigs_home }}"
    owner: "{{ uwsgi_user_name }}"
    group: "{{ uwsgi_group }}"
    recurse: yes
  become: yes

- name: adapt Mongo host and admin passphrase for dev/test
  set_fact:
    mongo_host: "{{ vars['mongo_host_'+ dtap] }}"
    mongodb_admin_password: "{{ vars['mongodb_admin_password_'+ dtap] }}"
    mongo_azure_private_endpoint: "{{ vars['mongo_azure_private_endpoint_'+ dtap] }}"

- name: replace the local mongodb connection string in the bioit_mongodb_scripts config file
  lineinfile:
    path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
    regexp: 'CONNECTION_STRING_LOCAL: to_be_replaced_by_ansible'
    line: "CONNECTION_STRING_LOCAL: mongodb://admin:{{ mongodb_admin_password }}@{{ mongo_host.split(',')[0] }}:27017,{{ mongo_host.split(',')[1] }}:27017,{{ mongo_host.split(',')[2] }}:27017/?replicaSet=bioit-HERA&authSource=admin"
  become: yes

- name: replace azure connection string in config file
  lineinfile:
    path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
    regexp: 'CONNECTION_STRING_AZURE: to_be_replaced_by_ansible'
    line: "CONNECTION_STRING_AZURE: mongodb+srv://admin:{{ mongodb_admin_password }}@{{ mongo_azure_private_endpoint }}.mongodb.net/?retryWrites=true&w=majority"

- name: Change Mongo dtap version in config based on playbook argument, HD only has 2 environments; test and prod. Files sent by HD are consumable and can only go in one of these two mongo databases. Files sent to HD can only be sent from one of these two DB to avoid duplications and confusion.
  lineinfile:
    path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
    regexp: 'dtap: to_be_replaced_by_ansible'
    line: "dtap: {{ 'test' if dtap == 'devtest' else 'prod' }}"

- name: Create Python virtual environment
  pip:
    requirements: "{{ bioit_bigs_home }}/bioit_nrc_integration/python/requirements.txt"
    virtualenv: "{{ nrcint_venv }}"
    virtualenv_python: python3.10
  become: yes

- name: restart nrcint supervisord which manages WSGI
  supervisorctl:
    name: nrcint
    state: restarted

- name: replace the username and password in the get_nominative_from_ODS script
  lineinfile:
    path: "{{ bioit_bigs_home }}//bioit_nrc_integration/python/get_nominative_from_ODS.py"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop: "{{ list_variables|flatten(levels=1) }}"
  vars:
    list_variables:
      - { regexp: "username = 'to_be_replaced_by_ansible'", line: "username = '{{ vars['nrc_integration_ODS_in_username_'+ dtap] }}'" }
      - { regexp: "password = 'to_be_replaced_by_ansible'", line: "password = '{{ vars['nrc_integration_ODS_in_password_'+ dtap] }}'" }
  become: yes

- name: replace the username and password in the send_mapping_table_to_ODS script
  lineinfile:
    path: "{{ bioit_bigs_home }}//bioit_nrc_integration/python/send_mapping_table_to_ODS.py"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop: "{{ list_variables|flatten(levels=1) }}"
  vars:
    list_variables:
      - { regexp: "username = 'to_be_replaced_by_ansible'", line: "username = '{{ vars['nrc_integration_ODS_out_username_'+ dtap] }}'" }
      - { regexp: "password = 'to_be_replaced_by_ansible'", line: "password = '{{ vars['nrc_integration_ODS_out_password_'+ dtap] }}'" }
  become: yes

- name: replace the password in the send_genomic_to_DWH script (username is the same)
  lineinfile:
    path: "{{ bioit_bigs_home }}//bioit_nrc_integration/python/send_mapping_table_to_ODS.py"
    regexp: "password = 'to_be_replaced_by_ansible'"
    line: "password = '{{ vars['nrc_integration_DWH_out_password_'+ dtap] }}'"
  become: yes

- name: add cronjob for nominative data parser from ODS
  cron:
    name: "get_nominative_from_ODS"
    minute: '*/10' # every 10 minutes
    hour: '*'
    weekday: '*'
    job: "/usr/bin/flock -n /tmp/get_nominative_from_ODS.lockfile {{ nrcint_venv }}/bin/python3.10 {{ bioit_bigs_home }}//bioit_nrc_integration/python/get_nominative_from_ODS.py"
    user: 'bigsdb'
    cron_file: get_nominative_from_ODS
  become: yes

- name: add cronjob for main sender to HD
  cron:
    name: "main_sender_to_HD"
    minute: '*/10' # every 10 minutes
    hour: '*'
    weekday: '*'
    job: "/usr/bin/flock -n /tmp/main_sender_to_HD.lockfile {{ nrcint_venv }}/bin/python3.10 {{ bioit_bigs_home }}//bioit_nrc_integration/python/main_sender_to_HD.py"
    user: 'bigsdb'
    cron_file: get_nominative_from_ODS
  become: yes
...