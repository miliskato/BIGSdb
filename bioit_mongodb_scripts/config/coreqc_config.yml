metrics:
  contamination:  # e.g. qc_kraken_illumina_value: "0.00%"
    threshold_direction: higher
    category: quality_checks
    field: qc_kraken_inputtype_value
    field_to_replace:
      inputtype: input_type
    value_format_to_strip: "%"
    available_for_fasta_input: true
    parameter_name: "% contamination (Kraken)"
  average_quality_score_illumina:  # e.g. qc_fqc_avg_qual_fwd_value: '250'
    threshold_direction: lower
    category: quality_checks
    fields:
      - qc_fqc_avg_qual_fwd_value
      - qc_fqc_avg_qual_rev_value
    available_for_fasta_input: false
    parameter_name: Average quality score
  average_quality_score_ont_R9:  # e.g. qc_nanoplot_qual_value: '250'
    threshold_direction: lower
    category: quality_checks
    field: qc_nanoplot_qual_value
    available_for_fasta_input: false
    parameter_name: Average quality score
  average_quality_score_ont_R10:  # e.g. qc_nanoplot_qual_value: '250'
    threshold_direction: lower
    category: quality_checks
    field: qc_nanoplot_qual_value
    available_for_fasta_input: false
    parameter_name: Average quality score
  average_gc_deviation_illumina:  # e.g. qc_fqc_gc_fwd_value: '1.5%'
    threshold_direction: higher
    category: quality_checks
    fields:
      - qc_fqc_gc_fwd_value
      - qc_fqc_gc_rev_value
    value_format_to_strip: "%"
    available_for_fasta_input: false
    parameter_name: Average GC deviation
  average_gc_deviation_ont:  # e.g. qc_fqc_gc_fwd_value: '1.5%'
    threshold_direction: higher
    category: quality_checks
    field: qc_seqkit_gc_value
    value_format_to_strip: "%"
    available_for_fasta_input: false
    parameter_name: Average GC deviation
  typing_loci_detected: # e.g. qc_typing_loci_value: '99.0%'
    threshold_direction: lower
    category: quality_checks
    field: qc_typing_loci_value
    value_format_to_strip: "%"
    available_for_fasta_input: true
    parameter_name: "Typing loci detected (%)"
  coverage_against_assembly:  # e.g. qc_cov_assembly_illumina_value: "18.00x"
    threshold_direction: lower
    category: quality_checks
    field: qc_cov_assembly_inputtype_value
    field_to_replace:
      inputtype: input_type
    value_format_to_strip: x
    available_for_fasta_input: false
    parameter_name: Coverage against the assembled contigs
    global_ont_coverage: true
  coverage_against_reference:  # e.g. qc_cov_ref_illumina_value: "18.00x"
    threshold_direction: lower
    category: quality_checks
    field: qc_cov_ref_inputtype_value
    field_to_replace:
      inputtype: input_type
    value_format_to_strip: x
    available_for_fasta_input: false
    parameter_name: Coverage against the reference
    global_ont_coverage: true
  assembly_length_deviation:  # e.g. qc_assembly_total_len_value: '0.90%'
    threshold_direction: higher
    category: quality_checks
    field: qc_assembly_total_len_value
    value_format_to_strip: "%"
    available_for_fasta_input: true
    parameter_name: Total assembly length deviation
  number_of_contigs:  # e.g. assembly_nb_contigs: "1"
    threshold_direction: higher
    category: quast
    field: assembly_nb_contigs
    available_for_fasta_input: true
    parameter_name: Number of contigs
  duplication_rate: # e.g. duplication_rate: "0.05"
    threshold_direction: higher
    category: trimming_inputtype
    category_to_replace:
      inputtype: input_type
    field: duplication_rate
    available_for_fasta_input: false
    parameter_name: Duplication rate post trimming
  median_depth_HA_NA: # e.g. preprocess_HA_covered_rate_post: '250'
    threshold_direction: lower
    category: preprocess
    field: preprocess_iterate_depth_median_post
    iterate:
      - HA
      - NA
    available_for_fasta_input: false
    parameter_name: Coverage depth on iterate segment (vertical)
  median_depth_other_segments: # e.g. preprocess_MP_depth_median_post: '250'
    threshold_direction: lower
    category: preprocess
    field: preprocess_iterate_depth_median_post
    iterate:
      - MP
      - NP
      - NS
      - PA
      - PB1
      - PB2
    available_for_fasta_input: false
    parameter_name: Coverage depth on iterate segment (vertical)
  coverage_all_segments: # e.g. preprocess_MP_covered_rate_post: '1.0'
    threshold_direction: lower
    category: preprocess
    field: preprocess_iterate_covered_rate_post
    iterate:
      - HA
      - NA
      - MP
      - NP
      - NS
      - PA
      - PB1
      - PB2
    available_for_fasta_input: false
    parameter_name: Coverage of iterate segment (horizontal)

