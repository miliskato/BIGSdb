<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f9f9f9; }
    .spinner { border: 8px solid #e0e0e0; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    p { font-size: 18px; color: #555; }
</style>
</head>
<body>
    <div class="spinner"></div>
    <p>Please wait, your file is loading...</p>
    <script>
        setTimeout(function() {
            var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
            window.location.href = window.location.href + sep + 'download_started=1';
        }, 500);
    </script>
</body>
</html>
