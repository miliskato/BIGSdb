---
# src parameter: If path is a directory, it is copied recursively. In this case, if path ends with "/", only inside contents of that directory are copied to destination. Otherwise, if it does not end with "/", the directory itself with all contents is copied.

- name: check version of postgres on the target VM
  block:
    - name: Get list of version directories
      ansible.builtin.find:
        paths: /etc/postgresql
        file_type: directory
      register: psql_dirlist

    - name: Fail when more than one version is found
      ansible.builtin.fail:
        msg: Multiple PostgreSQL versions are installed at the same time! If this is correct, supply the version variable directly with the playbook as an extra_var.
      when: psql_dirlist.matched > 1 and bioit_nrc_psql_version is not defined

    - name: Set PSQL version
      ansible.builtin.set_fact:
        bioit_nrc_psql_version: "{{ psql_dirlist.files[0].path.split('/')[-1] }}"
      when: bioit_nrc_psql_version is not defined

    - debug:
        var: bioit_nrc_psql_version

- name: Assert if species given
  fail:
    msg: "'species' argument required in -e when running playbook"
  when: species is not defined

- name: check if species in list
  vars:
    specieslist:
      - listeria
      - mycobacterium
      - neisseria
      - stec
      - salmonella
      - influenza
      - enterococcus_faecalis
      - enterococcus_faecium
  fail:
    msg: "unsupported species requested, choose from {{ specieslist }}"
  when: species not in specieslist

- name: Assert if branch given
  fail:
    msg: "'branch' argument required in -e when running playbook"
  when: branch is not defined

- name: Assert if dtap given
  fail:
    msg: "'mongo_dtap' argument required in -e when running playbook"
  when: mongo_dtap is not defined

- name: check if mongo_dtap in list
  vars:
    dtaplist:
      - dev
      - test
      - acc
      - prod
  fail:
    msg: "unsupported mongo_dtap requested, choose from {{ dtaplist }}"
  when: mongo_dtap not in dtaplist

- name: install git package
  apt:
    name: git

# this task comes before the git clone because the git directory path has been moved from /home/bigsdb/BIGSdb to /home/bigsdb/BIGSdb/BIGSdb as per request of RW 13jan23
- name: create bigsdb unix user
  ansible.builtin.user:
    name: bigsdb
    shell: /bin/sh
    group: www-data

- name: Check if folder /home/bigsdb/BIGSdb already exists
  stat:
    path: "{{ bioit_bigs_home }}"
  register: folder_stat

- name: Change bigs home owner where git needs to be cloned to root to not get dubious ownership error
  file:
    path: "{{ bioit_bigs_home }}"
    owner: root
  when: folder_stat.stat.exists and folder_stat.stat.isdir

- name: Get updated files from git repository
  git:
    repo: "https://{{bioit_git_ro_user}}:{{ secret_bioit_git_ro_password }}@{{bioit_git_server}}/bigsdb/bigsdb.git"
    dest: "{{ bioit_bigs_home }}"
    version: "{{ branch }}"
    force: true

- name: tasks to track deployment changes
  block:
    - name: mark bigsdb as safe
      ansible.builtin.shell:
        cmd: git config --global --add safe.directory "{{ bioit_bigs_home }}"

    - name: get commit hash used for deployment
      ansible.builtin.shell:
      args:
        cmd: git rev-parse HEAD
        chdir: "{{ bioit_bigs_home }}"
      register: bigsdb_commit_sha_cmd

    - name: get branch name used for deployment
      ansible.builtin.shell:
      args:
        chdir: "{{ bioit_bigs_home }}"
        cmd: git rev-parse --abbrev-ref HEAD
      register: bigsdb_branch_cmd
      ignore_errors: yes

    - name: get detached branch name used for deployment
      ansible.builtin.shell:
      args:
        chdir: "{{ bioit_bigs_home }}"
        cmd: git reflog | awk 'NR==1{ print $8; exit }'
      register: bigsdb_detached_branch_cmd
      ignore_errors: yes

    - name: get potential tag used for deployment
      ansible.builtin.shell:
      args:
        chdir: "{{ bioit_bigs_home }}"
        cmd: git describe --tags --exact-match
      register: bigsdb_tag_cmd
      ignore_errors: yes

    - name: set variables 1
      set_fact:
        git_branch: "{{ bigsdb_branch_cmd.stdout if bigsdb_branch_cmd.rc == 0 else '' }}"
        git_detached_branch: "{{ bigsdb_detached_branch_cmd.stdout if bigsdb_detached_branch_cmd.rc == 0 else '' }}"

    - name: set variables 2
      set_fact:
        bigsdb_commit_sha: "{{ bigsdb_commit_sha_cmd.stdout if bigsdb_commit_sha_cmd.rc == 0 else '' }}"
        bigsdb_branch: "{{ git_branch if git_branch != 'HEAD' else git_detached_branch }}"
        bigsdb_tag: "{{ bigsdb_tag_cmd.stdout if bigsdb_tag_cmd.rc == 0 else '' }}"

    - name: Check if folder /home/bigsdb/BIGSdb_deployments already exists
      stat:
        path: "{{ bioit_deployments_home }}"
      register: deployments_folder_stat

    - name: Change bigs home owner where git needs to be cloned to root to not get dubious ownership error
      file:
        path: "{{ bioit_deployments_home }}"
        owner: root
      when: deployments_folder_stat.stat.exists and deployments_folder_stat.stat.isdir

    - name: Get updated files from git repository
      git:
        repo: "https://{{bioit_git_ro_user}}:{{ secret_bioit_git_ro_password }}@{{bioit_git_server}}/bigsdb/bigsdb_deployments.git"
        dest: "{{ bioit_deployments_home }}"
        version: main
        force: true

    - name: mark bigsdb_deployments as safe
      ansible.builtin.shell:
      args:
        chdir: "{{ bioit_deployments_home }}"
        cmd: git config --global --add safe.directory "{{ bioit_deployments_home }}" && git config user.email bioit.beprepared@sciensano.be && git config user.name "Bigsdb Deployment"

    - name: keep track of the version deployed
      ansible.builtin.shell:
        chdir: "{{ bioit_deployments_home }}"
        cmd: "/bin/bash ./InsertDeployment.sh '{{ species }}' '{{ mongo_dtap }}' '{{ bigsdb_commit_sha }}' '{{ bigsdb_branch }}' '{{ bigsdb_tag }}' '{{ ansible_run_tags }}' '{{ ansible_skip_tags }}' '{{ lookup('env', 'USER') }}'"

    - name: commit modification of deployments file
      ansible.builtin.shell:
        chdir: "{{ bioit_deployments_home }}"
        cmd: git add "{{species}}.json" && git commit -m "Deployment info for {{ species }}@{{ mongo_dtap}}"

    - name: decrypt git password to be able to use "urlencode" in the following task
      set_fact:
        git_password_for_bigsdb: "{{ secret_bioit_git_bigsdb_password }}"

    - name: push to space
      ansible.builtin.shell:
      args:
        chdir: "{{ bioit_deployments_home }}"
        cmd: "git push https://{{ bioit_git_bigsdb_user }}:{{ git_password_for_bigsdb | urlencode }}@{{bioit_git_server}}/bigsdb/bigsdb_deployments.git"

    - name: Go back to bigsdb home
      ansible.builtin.shell:
        cmd: cd "{{ bioit_bigs_home }}"
  tags: track_deployments

- name: Change git cloned repo owner to bigsdb for it to be able to write the distance matrix here
  file:
    path: "{{ bioit_bigs_home }}"
    owner: bigsdb
    mode: "u=rwx,g=rx,o=rx"

- name: Change parent repo permission
  ansible.builtin.file:
    path: /home/bigsdb
    mode: "u=rwx,g=rx,o=rx"

- name: Change Mongo dtap version in config based on playbook argument
  lineinfile:
    path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
    regexp: 'dtap: to_be_replaced_by_ansible'
    line: "dtap: {{ mongo_dtap }}"

- name: Add apache psql password to bigsdb config
  lineinfile:
    path: "{{ bioit_bigs_home }}/conf/db.conf"
    regexp: 'dbpassword=to_be_replaced_by_ansible'
    line: "dbpassword={{ secret_bioit_bigs_postgresql_apache_password }}"

- name: add azure reportsapi ip to mongodb config
  lineinfile:
    path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
    regexp: 'azure_reportsapi_ip: to_be_replaced_by_ansible'
    line: "azure_reportsapi_ip: {{ azure_reportsapi_ip }}"

- name: add azure reportsapi ip to SciensanoReportPage
  lineinfile:
    path: "{{ bioit_bigs_home }}/lib/BIGSdb/SciensanoReportPage.pm"
    regexp: "my [$]azure_reportsapi = to_be_replaced_by_ansible ;"
    line: "my $azure_reportsapi = '{{ azure_reportsapi_ip }}' ;"

- name: setting up ssh connection to azure reportsapi
  block:
    - name: create bigsdb .ssh directory
      ansible.builtin.file:
        dest: '/home/bigsdb/.ssh'
        state: directory
        mode: 0700
        owner: bigsdb

    - name: set variable to handle the pass to the encrypted file for ssh key
      set_fact:
        path_to_key_file: "{{ path_to_key_file_dt }}"
      when: mongo_dtap == "dev" or mongo_dtap == "test"

    - name: set path to the encrypted file for ssh key in acc/prod instances
      set_fact:
        path_to_key_file: "{{ path_to_key_file_ap }}"
      when: mongo_dtap == "acc" or mongo_dtap == "prod"

    - name: Write secret private key to the file, replace literal linebreaks in secret by actual linebreaks
      copy:
        content: "{{ lookup('ansible.builtin.file', path_to_key_file) }}"
        dest: /home/bigsdb/.ssh/.id_rsa_reportsapi
        owner: bigsdb
        mode: '0600'

    - name: add new line not encrypted to get the proper format of the ssh key
      lineinfile:
        dest: /home/bigsdb/.ssh/.id_rsa_reportsapi
        line: ''

## perl 5 is installed on Ubuntu by default.
- name: Install packages
  apt:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - apache2
      - cpanminus
      - libapache2-mod-perl2
      - xvfb
      - liblog-log4perl-perl
      - libexcel-writer-xlsx-perl
      - libjson-perl
      - libnet-oauth-perl
      - libdata-random-perl
      - libemail-sender-perl
      - libemail-mime-perl
      - libemail-valid-perl
      - libfile-type-perl
      - libconfig-tiny-perl
      - libterm-prompt-perl
      - libdigest-bcrypt-perl
      - libparallel-forkmanager-perl
      - libbio-db-ncbihelper-perl
      - libbio-procedural-perl
      - libbio-tools-run-remoteblast-perl
      - libtime-duration-perl
      - libarchive-zip-perl
      - libbio-primerdesigner-perl
      - libcgi-pm-perl
      - libdata-uuid-libuuid-perl
      - libdbd-pg-perl
      - libdbi-perl
      - libexception-class-perl
      - libfile-map-perl
      - libio-string-perl
      - liblist-moreutils-perl
      - liblog-dispatch-filerotate-perl
      - libtest-lwp-useragent-perl
      - pdl
      - libtoml-perl
      - libtoml-parser-perl
      - libtry-tiny-perl
      - libxml-parser-perl
      - libdancer2-perl
      - starman
      - libpq-dev
      - acl

- name: Enable the Apache2 module cgid
  community.general.apache2_module:
    state: present
    name: cgid

- name: remove bad configuration file that disables js
  ansible.builtin.file:
    path: /etc/apache2/conf-enabled/javascript-common.conf
    state: absent

- name: Execute a2enmod proxy_http command
  command: sudo a2enmod proxy_http

- name: Check if reportsapi proxy configuration is present in apache
  shell: grep -q 'ProxyPass' /etc/apache2/apache2.conf && echo "Line exists" || echo "Line doesn't exist"
  register: reportsapi_proxy_check
  changed_when: false

- name: Add reportsapi proxy configuration to apache
  ansible.builtin.lineinfile:
    path: /etc/apache2/apache2.conf
    line: |
            <VirtualHost {{ inventory_hostname }}.{{ host_domain }}:80>
              ServerAlias *

              ProxyPass "/reportsapi" "http://{{ azure_reportsapi_ip }}:9090" timeout=10000
              ProxyPassReverse "/reportsapi" "http://{{ azure_reportsapi_ip }}:9090" timeout=10000
            </VirtualHost>
  when: reportsapi_proxy_check.stdout.find("Line doesn't exist") != -1

- name: Copy the perl.conf template
  ansible.builtin.template:
    src: "templates/perl_config.j2"
    dest: /etc/apache2/mods-available/perl.conf
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"

- name: Execute a2enmod perl command
  command: sudo a2enmod perl

- name: Restart service apache2
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: yes
    name: apache2

- name: Add pg_ident configuration
  lineinfile:
    path: "/etc/postgresql/{{bioit_nrc_psql_version}}/main/pg_ident.conf"
    insertafter: '# MAPNAME       SYSTEM-USERNAME         PG-USERNAME'
    line: "{{ item }}"
  loop:
    - "  mymap       postgres           postgres"
    - "  mymap       webmaster          postgres"
    - "  mymap       www-data           apache"
    - "  mymap       bigsdb             bigsdb"
    - "  mymap       bigsdb             apache"

- name: Install postGIS
  ansible.builtin.apt:
    name: "postgresql-{{bioit_nrc_psql_version}}-postgis-3"
  tags: postGIS

- name: Install bio perl package
  community.general.cpanm:
    executable: /usr/bin/cpanm
    mirror: https://www.cpan.org
    name: BioPerl

- name: create dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /usr/lib/cgi-bin/bigsdb/
    - /var/www/html/cgi-bin/bigsdb/
    - /usr/lib/cgi-bin/private/bigsdb/
    - /var/www/html/cgi-bin/private/bigsdb/

- name: Move files
  ansible.builtin.copy:
    src: "{{ bioit_bigs_home }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "u=rwx,g=rwx,o=rx"
    remote_src: yes
  loop: "{{ move_list|flatten(levels=1) }}"
  vars:
    move_list:
      - { src: bigsdb.pl, dest: /usr/lib/cgi-bin/bigsdb/ }
      - { src: bigsdb.pl, dest: /var/www/html/cgi-bin/bigsdb/ }
      - { src: bigscurate.pl, dest: /usr/lib/cgi-bin/private/bigsdb/ }
      - { src: bigscurate.pl, dest: /var/www/html/cgi-bin/private/bigsdb/ }
      - { src: lib/BIGSdb, dest: /usr/local/lib/ }
      - { src: javascript, dest: /var/www/html/ }
      - { src: css, dest: /var/www/html/ }
      - { src: webfonts, dest: /var/www/html/ }
      - { src: images, dest: /var/www/html/ }
      - { src: conf/, dest: /etc/bigsdb }
      - { src: bioit_etc.bigsdb.dbases/, dest: /etc/bigsdb/dbases }
      - { src: headers/, dest: /var/www/html/ }
      - { src: "bioit_website_varwwwhtml/{{ species }}.html", dest: /var/www/html/index.html }
      - { src: "bioit_website_varwwwhtml/Organisms _ PubMLST_files", dest: /var/www/html/ }
      - { src: "bioit_website_varwwwhtml/sciensano.be _ Healthy all life long_files", dest: /var/www/html/ }

- name: symlink index.html to species.html
  ansible.builtin.file:
    src: /var/www/html/index.html
    dest: "/var/www/html/{{ species }}.html"
    state: link
    force: true

- name: Configure microreact
  block:
    - name: Choose value for microreact token and host
      set_fact:
        microreact_token: "{{ microreact_token_dt }}"
        microreact_host: "{{ microreact_common_host_dt }}"
      when: mongo_dtap == "dev" or mongo_dtap == "test"

    - name: Choose value for microreact token and host when acc
      set_fact:
        microreact_token: "{{ microreact_token_acc }}"
        microreact_host: "{{ unique_host_acc }}"
      when: mongo_dtap == "acc"

    - name: Choose value for microreact token and host when prod
      set_fact:
        microreact_token: "{{ microreact_token_prod }}"
        microreact_host: "{{ unique_host_prod }}"
      when: mongo_dtap == "prod"

    - name: Add microreact urls according to DTAP and species if on prod
      lineinfile:
        path: '/etc/bigsdb/bigsdb.conf'
        regex: "{{ item.to_adapt}}"
        line: "{{ item.with_value }}"
      loop: "{{ var_list|flatten(levels=1) }}"
      vars:
        var_list:
          - { to_adapt: microreact_token=to_be_replaced_by_ansible, with_value: "microreact_token={{ microreact_token }}" }
          - { to_adapt: microreact_url_create=to_be_replaced_by_ansible, with_value: "microreact_url_create=https://{{ microreact_host }}/api/projects/create" }
          - { to_adapt: microreact_schema_converter=to_be_replaced_by_ansible, with_value: "microreact_schema_converter=https://{{ microreact_host }}/api/schema/convert" }

  tags: microreact_config

- name: copy dbmate executable on host
  ansible.builtin.get_url:
    url: "{{ linux_repo_tools }}/jammy/dbmate/v2_26_0/dbmate"
    dest: /usr/local/bin/
    owner: root
    group: root
    mode: "u=rwx,g=rx,o=rx"
  tags: dbmate

- name: setup core db's 1
  block:
    - name: create apache user
      community.postgresql.postgresql_user:
        login_user: postgres
        name: apache
        password: "{{ secret_bioit_bigs_postgresql_apache_password }}"
      vars:
        ansible_remote_tmp: /tmp
      become_user: postgres
      # check documentation if pass clear text or hash <- doesnt needa to hashed https://docs.w3cub.com/ansible~2.9/modules/postgresql_user_module

    - name: Add apache psql password to config
      lineinfile:
        path: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/config/config.yml"
        regexp: 'postgresql_apache_pass: to_be_replaced_by_ansible'
        line: "postgresql_apache_pass: {{ secret_bioit_bigs_postgresql_apache_password }}"

    - name: create core db (if it does not already exist) and run any pending migrations
      ansible.builtin.shell:
        chdir: "{{ bioit_bigs_home }}/sql/{{ item }}_v"
        cmd: DATABASE_URL=postgres://postgres:{{ postgresql_postgres_user_password }}@127.0.0.1:5432/{{ item }}?sslmode=disable dbmate up
      loop:
        - bigsdb_auth
        - bigsdb_prefs
        - bigsdb_refs
      tags: always

- name: setup temporary dir
  block:
    - name: adapt rights for temp_bigs
      ansible.builtin.file:
        path: /temp_bigs
        state: directory
        mode: "u=rwx,g=rwx,o=---"
        owner: bigsdb
        group: www-data

    - name: create subdir for temp files
      ansible.builtin.file:
        path: /temp_bigs/working_tmp
        state: directory
        owner: bigsdb
        group: www-data
        mode: "u=rwx,g=rwx,o=---"

    - name: create subdir for output files
      ansible.builtin.file:
        path: /temp_bigs/results_tmp
        state: directory
        owner: bigsdb
        group: www-data
        mode: "u=rwx,g=rwx,o=---"

    - name: create link to output files subdir
      ansible.builtin.file:
        src: /temp_bigs/results_tmp
        dest: /var/www/html/tmp
        state: link

  tags: temp_dir_bigs

- name: Touch bigsdb log
  ansible.builtin.file:
    path: /var/log/bigsdb.log
    state: touch
    mode: "u=rw,g=rw,o=r"
    owner: www-data

- name: Touch bigsdb_scripts.log
  ansible.builtin.file:
    path: /var/log/bigsdb_scripts.log
    state: touch
    mode: "u=rw,g=rw,o=rw"
    owner: bigsdb

- name: setup offline jobs
  block:
    - name: create bigsdb sql user
      community.postgresql.postgresql_user:
        login_user: postgres
        name: bigsdb
      become_user: postgres

    - name: create bigdb_jobs database (if it does not already exist) and run any pending migrations
      ansible.builtin.shell:
        chdir: "{{ bioit_bigs_home }}/sql/bigsdb_jobs_v"
        cmd: DATABASE_URL=postgres://postgres:{{ postgresql_postgres_user_password }}@127.0.0.1:5432/bigsdb_jobs?sslmode=disable dbmate up
      tags: always

    - name: move bigsjobs.pl
      ansible.builtin.copy:
        src: "{{ bioit_bigs_home }}/bigsjobs.pl"
        dest: /usr/local/bin/bigsjobs.pl
        owner: root
        group: root
        mode: "u=rwx,g=rwx,o=rx"
        remote_src: yes

    - name: Touch bigsdb jobs log
      ansible.builtin.file:
        path: /var/log/bigsdb_jobs.log
        state: touch
        mode: "u=rwx,g=rw,o=r"
        owner: bigsdb
  tags: offlinejobs

- name: setup submission system
  block:
    - name: create submission dir
      ansible.builtin.file:
        path: /var/submissions
        state: directory
        mode: "u=rwx,g=rw,o=r"
        owner: www-data
        group: www-data

    - name: symlink submissions dir
      ansible.builtin.file:
        src: /var/submissions
        dest: /var/www/submissions
        state: link

- name: setup GrapeTree
  tags: installgt
  block:
    - name: create GrapeTree html dir
      ansible.builtin.file:
        path: /var/www/html/GrapeTree
        state: directory
        force: yes

    - name: Install grapetree via pip
      ansible.builtin.pip:
        name: grapetree
        virtualenv: "/var/www/html/gt_venv"
        virtualenv_python: python3.8

        # - name: copy  GrapeTree files to html for web usage
        # ansible.builtin.copy:
        # src: /usr/local/bin/lmod/grapetree/1.5/venv/lib/python2.7/site-packages/grapetree/
        # dest: /var/www/html/GrapeTree
        # remote_src: yes

    - name: copy GrapeTree files to html for web usage
      ansible.builtin.copy:
        src: /var/www/html/gt_venv/lib/python3.8/site-packages/grapetree/
        dest: /var/www/html/GrapeTree
        remote_src: yes

    - name: remove reverse proxy or access to enterobase
      replace:
        path: /var/www/html/GrapeTree/static/js/tree/grapetree_fileHandler.js
        regexp: "url:\\s+('.*'\\+)"
        replace: 'url: '

- name: Create isolates db to initialize postGIS
  community.postgresql.postgresql_db:
    login_user: postgres
    name: "bigsdb_{{ species }}_isolates"
  become_user: postgres

- name: Adds postgis extension to the isolate database in the schema public
  postgresql_ext:
    name: postgis
    login_db: "bigsdb_{{ species }}_isolates"
    login_user: postgres
  become_user: postgres
  tags: postGIS

- name: Copy dbmate migrations files common to all species in the migration folder specific of the current species
  ansible.builtin.copy:
    src: "{{ bioit_bigs_home }}/sql/bigsdb_isolates_v/common/db/migrations/"
    dest: "{{ bioit_bigs_home }}/sql/bigsdb_isolates_v/bigsdb_{{ species }}_isolates/db/migrations/"
    remote_src: yes
  tags: always

- name: Create species (refseq and isolates) data db (if they don't already exist) and run any pending migrations
  ansible.builtin.shell:
    chdir: "{{ bioit_bigs_home }}/sql/{{ item.dbmate_repo }}"
    cmd: DATABASE_URL=postgres://postgres:{{ postgresql_postgres_user_password }}@127.0.0.1:5432/{{ item.db_name }}?sslmode=disable dbmate up
  loop: "{{ db_info|flatten(levels=1) }}"
  vars:
    db_info:
      - { dbmate_repo: "bigsdb_seqdef_v", db_name: "bigsdb_{{ species }}_seqdef" }
      - { dbmate_repo: "bigsdb_isolates_v/bigsdb_{{ species }}_isolates", db_name: "bigsdb_{{ species }}_isolates" }
  tags: always

- name: create global user database
  block:
    - name: create global bigsdb users db (if it does not already exist) and run any pending migrations
      ansible.builtin.shell:
        chdir: "{{ bioit_bigs_home }}/sql/global_bigsdb_users_v"
        cmd: DATABASE_URL=postgres://postgres:{{ postgresql_postgres_user_password }}@127.0.0.1:5432/global_bigsdb_users?sslmode=disable dbmate up
      tags: always

    - name: create bioit user
      postgresql_query:
        login_db: global_bigsdb_users
        login_user: postgres
        query: INSERT INTO users (user_name,surname,first_name,email,affiliation,date_entered,datestamp,status) VALUES ('bioit','Sciensano','Bioit', 'bioit@sciensano.be','Sciensano','now','now', 'validated') ON CONFLICT DO NOTHING
      become_user: postgres

    - name: add user password with perl script with bcrypt
      shell: "perl {{ bioit_bigs_home }}/scripts/maintenance/add_user.pl -a -d global_bigsdb_users -n bioit -p {{ secret_bioit_bigsdb_gui_password }}"

    - name: permissions
      postgresql_query:
        login_db: global_bigsdb_users
        login_user: postgres
        query: INSERT INTO permissions (user_name,permission,curator,datestamp) VALUES ('bioit','import_dbase_configs','bioit','now'), ('bioit','set_site_user_passwords','bioit','now'), ('bioit','merge_users','bioit','now'), ('bioit','modify_users','bioit','now') ON CONFLICT DO NOTHING
      become_user: postgres

    - name: add bioit user to all species db
      postgresql_query:
        login_db: "{{ item }}"
        login_user: postgres
        query: INSERT INTO users (id, user_name, surname, first_name, email, affiliation, status, date_entered, datestamp, curator) VALUES (1,'bioit','Sciensano','Bioit', 'bioit@sciensano.be','Sciensano','admin','now','now', 1) ON CONFLICT DO NOTHING
      loop:
        - "bigsdb_{{ species }}_seqdef"
        - "bigsdb_{{ species }}_isolates"
      become_user: postgres

    - name: add user db to species db
      postgresql_query:
        login_db: "{{ item }}"
        login_user: postgres
        query: INSERT INTO user_dbases (id, name, dbase_name, curator, datestamp) VALUES (1, '', 'global_bigsdb_users', 1, 'now') ON CONFLICT DO NOTHING;
      loop:
        - "bigsdb_{{ species }}_seqdef"
        - "bigsdb_{{ species }}_isolates"
      become_user: postgres
        # this should be other when but doesnt matter for now

    - name: update users to be from user_db, this order is required because else fails due to keys
      postgresql_query:
        login_db: "{{ item }}"
        login_user: postgres
        query: UPDATE users SET user_db=1 WHERE user_name='bioit'
      loop:
        - "bigsdb_{{ species }}_seqdef"
        - "bigsdb_{{ species }}_isolates"
      become_user: postgres
  tags: make_user_db

- name: setup REST API
  block:
    - name: Touch bigsdb rest log
      ansible.builtin.file:
        path: /var/log/bigsdb_rest.log
        state: touch
        mode: "u=rwx,g=rw,o=r"
        owner: bigsdb

    - name: create rest db (if it does not already exist) and run any pending migrations
      ansible.builtin.shell:
        chdir: "{{ bioit_bigs_home }}/sql/bigsdb_rest_v"
        cmd: DATABASE_URL=postgres://postgres:{{ postgresql_postgres_user_password }}@127.0.0.1:5432/bigsdb_rest?sslmode=disable dbmate up
      tags: always

    - name: create rest dir
      ansible.builtin.file:
        path: /var/rest
        state: directory
        owner: root

    - name: copy perl script
      ansible.builtin.copy:
        src: "{{ bioit_bigs_home }}/bigsrest.pl"
        dest: /var/rest/bigsrest.pl
        owner: root
        group: root
        remote_src: yes
        mode: "u=rwx,g=rwx,o=rx"

    - name: add system service
      ansible.builtin.copy:
        src: "{{ bioit_bigs_home }}/rest/bigsdb-rest.service"
        dest: /etc/systemd/system/bigsdb-rest.service
        owner: root
        group: root
        remote_src: yes
        mode: "u=rwx,g=rwx,o=rx"

    - name: insert db to be shown in rest
      postgresql_query:
        login_db: bigsdb_rest
        login_user: postgres
        query: "{{ item }}"
      loop:
        - "INSERT INTO resources (dbase_config,description) VALUES ('bigsdb_{{ species }}_seqdef','{{ species }} sequence/profile definitions'), ('bigsdb_{{ species }}_isolates','{{ species }} isolates') ON CONFLICT DO NOTHING"
        - "INSERT INTO groups (name,description) VALUES ('{{ species }}','{{ species }}') ON CONFLICT DO NOTHING"
        - "INSERT INTO group_resources (group_name,dbase_config) VALUES ('{{ species }}','bigsdb_{{ species }}_seqdef'), ('{{ species }}','bigsdb_{{ species }}_isolates') ON CONFLICT DO NOTHING"
      become_user: postgres

    - name: Restart service rest
      ansible.builtin.systemd:
        state: restarted
        daemon_reload: yes
        name: bigsdb-rest.service
        enabled: yes
  tags: rest_api

- name: setup Mongodb for pathogen collection
  block:
    - name: adapt Mongo host and admin passphrase for dev/test
      set_fact:
        mongo_host: "{{ mongo_host_dt }}"
        mongodb_admin_password: "{{ mongodb_admin_password_dt }}"
        mongo_azure_private_endpoint: "mongodb-atlas-devtest-pl-0.fgpmn"
      when: mongo_dtap == "dev" or mongo_dtap == "test"

    - name: adapt Mongo host and admin passphrase for acc/prod
      set_fact:
        mongo_host: "{{ mongo_host_ap }}"
        mongodb_admin_password: "{{ mongodb_admin_password_ap }}"
        mongo_azure_private_endpoint: "mongodb-atlas-accprod-pl-0.lw3rk"
      when: mongo_dtap == "acc" or mongo_dtap == "prod"

    - name: choose Mongo passphrase for NRC user and DTAP
      set_fact:
        mongo_user_password: "{{ item.val }}"
      loop: "{{ dtap_list|flatten(levels=1)  }}"
      vars:
        dtap_list:
          - { val: "{{ mongo_user_pass_dev }}", dtap: dev }
          - { val: "{{ mongo_user_pass_test }}", dtap: test }
          - { val: "{{ mongo_user_pass_acc }}", dtap: acc }
          - { val: "{{ mongo_user_pass_prod }}", dtap: prod }
      when: mongo_dtap  == item.dtap

    - debug:
        var: mongo_host

    - name: Get status of the replica set
      community.mongodb.mongodb_status:
        login_host: "{{ mongo_host.split(',')[0] }}"
        login_user: admin
        login_password: "{{ mongodb_admin_password }}"
        replica_set: bioit-HERA
        poll: 3
        interval: 10
      register: rs
      delegate_to: "{{ mongo_host.split(',')[0] }}"

    - name: Lookup PRIMARY replicaset member
      set_fact:
        primary: "{{ item.key.split('.')[0] }}"
      loop: "{{ lookup('dict', rs.replicaset) }}"
      when: "'PRIMARY' in item.value"

    - name: create NRC user for the db
      community.mongodb.mongodb_user:
        login_host: "{{ primary }}"
        login_user: admin
        login_password: "{{ mongodb_admin_password }}"
        login_port: 27017
        database: "{{ species }}_{{ mongo_dtap }}"
        name: "{{ species }}User_{{ mongo_dtap }}"
        password: "{{ mongo_user_password }}"
        roles: readWrite
      delegate_to: "{{ primary }}"

    - name: replace string for mongo user pass in config
      lineinfile:
        path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
        regexp: 'MONGO_DB_PASSWORD: to_be_replaced_by_ansible'
        line: "MONGO_DB_PASSWORD: {{ mongo_user_password }}"

  tags: mongo_setup

- name: populate databases
  block:
    - name: Change file ownership for postgres scripts
      ansible.builtin.file:
        path: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/bigsdb_{{ item }}.sql"
        mode: u=rwx,g=rx,o=rx
      when: item != 'influenza_seqdef'
      loop:
        - "{{ species }}_seqdef"
        - "{{ species }}_isolates"

    - name: run a collection of "insert into/on conflict do nothing" for the dedicated species
      community.postgresql.postgresql_script:
        login_user: postgres
        login_db: "{{ item.db }}"
        path: "{{ item.script }}"
        search_path:
          - public
      when: item.db != 'bigsdb_influenza_seqdef'
      loop: "{{ list_script|flatten(levels=1) }}"
      vars:
        list_script:
          - { db: "bigsdb_{{ species }}_seqdef", script: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/bigsdb_{{ species }}_seqdef.sql" }
          - { db: "bigsdb_{{ species }}_isolates", script: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/bigsdb_{{ species }}_isolates.sql" }
      become_user: postgres
      tags: always

    - name: add geographic coordinates for zip codes
      ansible.builtin.shell:
        chdir: "{{ bioit_bigs_home }}/sql"
        cmd: "sudo -u postgres psql -d bigsdb_{{ species }}_isolates -f add_zipcode_coord.sql"
      tags: always

    - name: populate db with python sql scripts
      block:
        - name: Install requirements bigs
          pip:
            requirements: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/requirements.txt"
            virtualenv: "{{ bioit_bigs_home }}/3.12PythonVenv"
            virtualenv_python: python3.12
          tags: bigs_pip_requirements

        - name: Install requirements mongo
          pip:
            requirements: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/requirements.txt"
            virtualenv: "{{ bioit_bigs_home }}/3.12PythonVenv"
            virtualenv_python: python3.12

- name: Restart service rest after all other steps
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: yes
    name: bigsdb-rest.service
    enabled: yes
  tags: rest_serv

- name: create scratch temp dir
  ansible.builtin.file:
    path: /scratch/temp/
    state: directory
    owner: root
    mode: "u=rwx,g=rwx,o=rwx"

- name: setup cron
  block:
    - name: Add cron.d entry for bigsjobs
      cron:
        name: "bigsjobs.pl"
        minute: '*/1'        # every minute
        hour: '*'
        weekday: '*'
        job: 'xvfb-run -a /usr/local/bin/bigsjobs.pl'
        user: 'bigsdb'
        cron_file: bigsdb_jobs

    - name: Add cron.d entry for bigsdb upload tool
      cron:
        name: "cron_startinsertion_lab_metadata.sh"
        minute: '*/2'         # every 2 minute
        hour: '*'
        weekday: '*'
        job: 'bash /home/bigsdb/BIGSdb/bioit_bigsdb_scripts/cron_startinsertion_lab_metadata.sh'
        user: 'bigsdb'
        cron_file: bigsdb_upload
      tags: bigs_upload_cron

    - name: Adapt species in bash script related to bigsdb upload
      lineinfile:
        path: "{{ bioit_bigs_home }}/bioit_bigsdb_scripts/cron_startinsertion_lab_metadata.sh"
        regexp: "--species to_be_replaced_by_ansible"
        line: "/home/bigsdb/BIGSdb/3.12PythonVenv/bin/python3.12 /home/bigsdb/BIGSdb/bioit_bigsdb_scripts/components/metadata_insertion_from_bigs.py --species {{ species }} "
      tags: bigs_upload_cron

    - name: Add cron.d entry for global db
      cron:
        name: "sync_user_dbase_users.pl"
        minute: '*/5'       # every 5 minutes
        hour: '*'
        weekday: '*'
        job: 'perl /usr/local/bin/sync_user_dbase_users.pl --user_database pubmlst_bigsdb_users'
        user: 'bigsdb'
        cron_file: sync_globalbigsdbusers

    - name: Remove cron.d entries for hash replacer  # Runs on Azure in the combination
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "/etc/cron.d/{{ species }}_tempid_replacer_cgmlst"
        - "/etc/cron.d/{{ species }}_tempid_replacer_mlst"
        - "/etc/cron.d/{{ species }}_tempid_replacer_mlst_warwick"
        - "/etc/cron.d/{{ species }}_tempid_replacer_mlst_pasteur"

    - name: Remove cron.d entries for database updates
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "/etc/cron.d/{{ species }}_loci_intopsql"
        - "/etc/cron.d/{{ species }}_alleles_intopsql"
        - "/etc/cron.d/{{ species }}_schemeprofiles_intopsql"
        - "/etc/cron.d/{{ species }}_genedetection_intopsql"

    - name: add daily cronjob
      ansible.builtin.copy:
        src: "{{ bioit_bigs_home }}/cron/cron.daily/periodically_remove_temporary_files"
        dest: /etc/cron.daily/
        owner: root
        group: root
        remote_src: yes

    - name: adapt tmp dir in cleaning cronjob
      replace:
        path: '/etc/cron.daily/periodically_remove_temporary_files'
        regexp: "{{ item }}"
        replace: /temp_bigs/
      loop:
        - \/var\/tmp/
        - \/var\/www\/tmp\/

    - name: chmod cron job
      ansible.builtin.file:
        path: '/etc/cron.daily/periodically_remove_temporary_files'
        mode: "u=rwx,g=rx,o=rx"

    - name: Remove daily cronjob for temporary alerts implementation
      ansible.builtin.file:
        path: /etc/cron.d/temporary_alerts_implementation
        state: absent

    - name: Remove the cronjob for mongo to bigs
      ansible.builtin.file:
        path: /etc/cron.d/mongo_to_bigs_hourly
        state: absent

    - name: Remove the cronjob for insertion of report from galaxy into mongodb
      ansible.builtin.file:
        path: /etc/cron.d/mongo_galaxy
        state: absent

    - name: add hourly cronjob to check killed pid
      cron:
        name: "check_jobs_killed"
        minute: '0'
        hour: '*/1'  # every hour
        weekday: '*'
        job: "{{ bioit_bigs_home }}/3.12PythonVenv/bin/python3.12 {{ bioit_bigs_home }}/bioit_bigsdb_scripts/check_jobs_killed.py"
        user: 'root'
        cron_file: check_jobs_killed

    - name: Remove the cronjob to capture missing badqc
      ansible.builtin.file:
        path: /etc/cron.d/check_for_missing_badqc
        state: absent

  tags: cron_jobs

- name: create service for bigsdb_insertion
  block:
    - name: add systemd service for automatic insertion
      ansible.builtin.copy:
        src: "{{ bioit_bigs_home }}/bigsdb-insertion.service"
        dest: '/etc/systemd/system/bigsdb-insertion-{{ species }}.service'
        owner: root
        group: root
        remote_src: yes
        mode: "u=rwx,g=rwx,o=rx"

    - name: replace species in bigsdb-insertion service
      ansible.builtin.replace:
        path: '/etc/systemd/system/bigsdb-insertion-{{ species }}.service'
        regexp: 'to_be_replaced_by_ansible'
        replace: "{{ species }}"

    - name: set asb connection string for dev/test
      set_fact:
        asb_connection_str: "{{ asb_connection_str_dt }}"
      when: mongo_dtap == "dev" or mongo_dtap == "test"

    - name: set asb connection string for acc/prod
      set_fact:
        asb_connection_str: "{{ asb_connection_str_ap }}"
      when: mongo_dtap == "acc" or mongo_dtap == "prod"

    - name: Change connection str in mongo config based on playbook argument for dev-test
      lineinfile:
        path: "{{ bioit_bigs_home }}/bioit_mongodb_scripts/config/config.yml"
        regexp: 'CONNECTION_STRING_ASB: to_be_replaced_by_ansible'
        line: "CONNECTION_STRING_ASB: {{ asb_connection_str }}"

    - name: Create subfolder in /var/log where bigsdb user is allowed to write
      ansible.builtin.file:
        path: /var/log/bigsdb_insertions_service
        state: directory
        mode: "u=rwx,g=rwx,o=rwx"
        owner: bigsdb

    - name: Touch log file for bigsdb_insertion service
      ansible.builtin.file:
        path: "/var/log/bigsdb_insertions_service/bigsdb_insertions_{{ species }}.log"
        state: touch
        mode: "u=rwx,g=rwx,o=rwx"
        owner: bigsdb

    - name: activate the service
      ansible.builtin.systemd:
        daemon-reload: true
        state: restarted
        enabled: true
        name: "bigsdb-insertion-{{ species }}.service"

- name: create sftp users that can access the /output_reports
  block:
    - name: Create user group
      group:
        name: sftp
        state: present

    - name: select password for sftp user and DTAP
      set_fact:
        sftp_user_password: "{{ item.val }}"
      loop: "{{ dtap_list|flatten(levels=1)  }}"
      vars:
        dtap_list:
          - { val: "{{ sftp_user_pass_dev }}", dtap: dev }
          - { val: "{{ sftp_user_pass_test }}", dtap: test }
          - { val: "{{ sftp_user_pass_acc }}", dtap: acc }
          - { val: "{{ sftp_user_pass_prod }}", dtap: prod }
      when: mongo_dtap == item.dtap

    - name: Create user
      user:
        name: "sftp_{{ species }}_{{ mongo_dtap }}"
        group: "sftp"
        shell: "/sbin/nologin"
        home: "/home/sftp_{{ species }}_{{ mongo_dtap }}"
        password: "{{ sftp_user_password }}"
        state: present

    - name: creation of jail section for output reports
      blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          Match Group sftp
            ChrootDirectory /output_reports
            PermitTunnel no
            X11Forwarding no
            AllowTcpForwarding no
            ForceCommand internal-sftp
      tags: output_reports_jail

    - name: restart sshd service
      ansible.builtin.systemd:
        state: restarted
        daemon_reload: yes
        name: sshd

    - name: creation of the subdirectories in the /output_reports jail
      ansible.builtin.file:
        path: /output_reports/{{ item }}
        state: directory
        owner: root
        mode: "u=rwx,g=rwx,o=rwx"
      loop:
        - accepted
        - rejected
        - coreqc_rejected
      tags: output_reports_jail
  tags: sftp_users
